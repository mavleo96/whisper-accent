# Hardware settings
devices: 1
precision: 16-mixed
accelerator: "auto"
strategy: "auto"

# Training parameters
max_epochs: 5
gradient_clip_val: 1.0
accumulate_grad_batches: 2
log_every_n_steps: 10
save_dir: "checkpoints"
check_val_every_n_epoch: 1

# Logging
logger:
  - name: "tensorboard"
    save_dir: "logs"
