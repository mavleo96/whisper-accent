model:
  model_name: "openai/whisper-base.en"
  optimizer_config:
    lr: 1e-5
    weight_decay: 0.01
  num_accents: 12

data:
  batch_size: 8
  num_workers: 1
  model_name: "openai/whisper-base.en"
  preprocess_batch_size: 8
  max_length: 448
  cache_dir: "/data/vijay/rice-bag/data"

trainer:
  # Hardware settings
  devices: 1
  precision: 16-mixed
  accelerator: "auto"
  strategy: "auto"

  # Training parameters
  max_epochs: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  log_every_n_steps: 10
  save_dir: "checkpoints"
  check_val_every_n_epoch: 10

  # Logging
  logger:
    - name: "tensorboard"
      save_dir: "logs"
