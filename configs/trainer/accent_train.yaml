model:
  model_name: "openai/whisper-base.en"
  optimizer_config:
    lr: 1e-5
    weight_decay: 0.01
  num_accents: 12

data:
  batch_size: 8
  num_workers: 4
  model_name: "openai/whisper-base.en"
  preprocess_batch_size: 8
  max_length: 448
  cache_dir: "/home/jelwin/rice-bag/.cache"

trainer:
  # Hardware settings
  devices: 1
  precision: 32
  accelerator: "auto"
  strategy: "auto"
  
  # Training parameters
  max_epochs: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  val_check_interval: 0.5
  log_every_n_steps: 50
  early_stopping_patience: 3
  save_dir: "checkpoints"
  
  # Logging
  logger:
    - name: "tensorboard"
      save_dir: "logs"