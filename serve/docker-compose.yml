services:
  backend:
    build:
      context: ..
      dockerfile: serve/backend/Dockerfile
    environment:
      MODEL_ID: ${MODEL_ID:-mavleo96/whisper-accent-medium.en}
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: serve/frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "7860:7860"
    depends_on:
      backend:
        condition: service_healthy
